<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Llegada - SI-3</title>
    <link rel="icon" type="image/png" href="Logo-Web-SI3.png">
        <link rel="stylesheet" href="styles.css?v=16">
    <style>
        body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(125deg, #102d52 0%, #173f70 58%, #3478c5 100%); }
        h1 { margin-bottom: 10px; font-size: clamp(1.4rem, 4vw, 1.8rem); color: white; text-align: center; }
        p { margin-bottom: 20px; color: #c6d7e6; text-align: center; }
        #qr { width: min(250px, 72vw); height: min(250px, 72vw); background: white; padding: 12px; border: 2px solid #a9d6f5; border-radius: 8px; box-shadow: 0 20px 42px rgba(5, 24, 46, 0.25); }
        img, canvas { width: 100%; height: 100%; }
        #msg { min-height: 1.5em; margin-top: 18px; color: #b9ddf7; font-weight: 700; }
    </style>
</head>
<body>
    <h1>QR Confirmar Llegada</h1>
    <p>Escanee para confirmar</p>
    <div id="qr"></div>
    <p id="msg">Cargando...</p>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <script>
        window.onload = function() {
            setTimeout(generarQR, 300);
        };
        
        function generarQR() {
            var container = document.getElementById('qr');
            var msg = document.getElementById('msg');
            
            if (typeof QRCode === 'undefined') {
                msg.innerHTML = 'Error: librería no cargó';
                return;
            }
            
            var baseUrl = window.location.href.split('/').slice(0, -1).join('/') + '/';
            var url = baseUrl + 'llegada.html';
            
            msg.innerHTML = 'Generando...';
            
            try {
                var qr = new QRCode(container, {
                    text: url,
                    width: 250,
                    height: 250,
                    colorDark: "#000000",
                    colorLight: "#ffffff"
                });
                
                msg.innerHTML = '✓ Listo';
                msg.style.color = '#90EE90';
            } catch(e) {
                msg.innerHTML = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
